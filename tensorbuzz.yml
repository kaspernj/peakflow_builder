before_install:
  - |
    set --
    command -v shellcheck >/dev/null 2>&1 || set -- "$@" shellcheck
    command -v jq >/dev/null 2>&1 || set -- "$@" jq
    command -v docker >/dev/null 2>&1 || set -- "$@" docker.io
    docker compose version >/dev/null 2>&1 || set -- "$@" docker-compose-v2
    if [ "$#" -gt 0 ]; then
      sudo apt-get update
      sudo apt-get install --yes --no-install-recommends "$@"
    fi

builds:
  validate:
    name: Validate
    script:
      - shellcheck scripts/*.sh
      - docker compose --env-file .env.example config --quiet
      - docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.socketduct.yml config --quiet
      - |
        docker compose --env-file .env.example config --format json |
          jq -e --rawfile compose docker-compose.yml '
            ($compose | capture(
              "(?m)^      - type: bind\\n"
              + "        source: [^\\n]+\\n"
              + "        target: /etc/docker/certs\\.d\\n"
              + "        read_only: true\\n"
              + "        bind:\\n"
              + "          create_host_path: (?<create_host_path>true|false)$"
            )) as $declared_bind
            |
            [.services["docker-server"].volumes[] | select(.target == "/etc/docker/certs.d")] as $mounts
            | ($mounts | length) == 1
              and $mounts[0].type == "bind"
              and $mounts[0].read_only == true
              and ($declared_bind | has("create_host_path"))
              and $declared_bind.create_host_path == "false"
          '
      - |
        docker compose --env-file .env.example config --format json |
          jq -e '
            .services["docker-server"] as $service
            | $service.image == "docker:29.3.0-dind"
              and [$service.command[] | select(startswith("--host="))] == [
                "--host=unix:///var/run/docker.sock",
                "--host=tcp://0.0.0.0:8676"
              ]
              and [$service.command[] | select(startswith("--tls"))] == [
                "--tlsverify",
                "--tlscacert=/shared/certificates/tlscacert.pem",
                "--tlscert=/shared/certificates/tlscert.pem",
                "--tlskey=/shared/certificates/tlskey.pem"
              ]
              and ($service.ports | length) == 1
              and $service.ports[0].target == 8676
              and $service.ports[0].published == "8676"
              and ($service.command | index("--registry-mirror=http://192.168.86.82:5000")) != null
              and ($service.command | index("--insecure-registry=192.168.86.82:5000")) != null
              and ([$service.volumes[].target] | sort) == ["/etc/docker/certs.d", "/shared"]
              and ([$service.volumes[] | select(.target == "/etc/docker/certs.d" and .read_only == true)] | length) == 1
          '
      - |
        docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.socketduct.yml config --format json |
          jq -e '
            .services["docker-server"] as $service
            | $service.image == "docker:29.3.0-dind"
              and [$service.command[] | select(startswith("--host="))] == [
                "--host=unix:///var/run/docker.sock",
                "--host=tcp://0.0.0.0:2375"
              ]
              and ([$service.command[] | select(startswith("--tls"))] | length) == 0
              and $service.environment.DOCKER_TLS_CERTDIR == ""
              and (($service.ports // []) | length) == 0
              and ($service.command | index("--registry-mirror=http://192.168.86.82:5000")) != null
              and ($service.command | index("--insecure-registry=192.168.86.82:5000")) != null
              and ([$service.volumes[].target] | sort) == ["/etc/docker/certs.d", "/shared"]
              and ([$service.volumes[] | select(.target == "/etc/docker/certs.d" and .read_only == true)] | length) == 1
          '
